<style>
:root{
  /* layout: one-screen app. HUD strip, battle canvas, tab bar, scrolling panel. Single night theme by choice. */
  --night:#0e0b1d; --panel:#181331; --panel2:#231c44; --line:#3a3163;
  --ink:#f1ebff; --dim:#a79fc9; --gold:#f2c14e; --ember:#ff6b3d; --arc:#5fd4ff;
  --good:#6fe39a; --bad:#ff5c7a;
  --r0:#b9b4c7; --r1:#5aa9ff; --r2:#c77dff; --r3:#ffb23e; --r4:#3df5c8;
  --display:'Suez One','Assistant',serif; --body:'Assistant','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;overflow:hidden}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#120e26,#0e0b1d)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#hud{padding:6px 14px 5px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
#hud .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hName{font-family:var(--display);font-size:19px;color:var(--gold);letter-spacing:.3px}
#hCls{color:var(--dim);font-size:13px;margin-inline-start:6px}
.lv b{color:var(--ink);font-size:17px}
.lv{color:var(--dim);font-size:13px;white-space:nowrap}
.bar{height:9px;background:#0a0818;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5cff,var(--arc));width:0;transition:width .25s}
.bar.gold i{background:linear-gradient(90deg,#c9892a,var(--gold))}
#hud .cur{display:flex;gap:14px;font-size:13px;color:var(--dim);flex-wrap:nowrap;white-space:nowrap;overflow:hidden}
#app.wide #stage{flex:1;max-height:none}#app.wide #panel{display:none}
#fsBtn{position:absolute;left:8px;bottom:176px;height:28px;font-size:12px;font-weight:700;color:#fff;background:rgba(10,8,24,.72);padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}
#app{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#bigBtn{position:absolute;left:8px;bottom:142px;height:28px;font-size:12px;font-weight:700;color:#fff;background:rgba(10,8,24,.72);padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}
#hud .cur b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}

#stage{position:relative;flex:0 0 60%;min-height:260px;max-height:72vh;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
#zoneTag{position:absolute;inset-inline-start:8px;top:8px;pointer-events:none;font-size:12px;color:#fff;background:rgba(10,8,24,.6);padding:3px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
#rateTag:empty{display:none}
#boostTag{position:absolute;inset-inline-end:8px;top:36px;pointer-events:none;font-size:12px;font-weight:700;color:#1a1230;background:linear-gradient(90deg,#ffd75e,#ffb23e);padding:3px 9px;border-radius:10px;box-shadow:0 0 10px #f2c14e88;font-variant-numeric:tabular-nums}
#boostTag:empty{display:none}
#rateTag{position:absolute;inset-inline-end:8px;top:8px;pointer-events:none;font-size:12px;color:var(--good);background:rgba(10,8,24,.6);padding:3px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
#resetNow{position:absolute;top:44px;inset-inline:0;margin:auto;width:max-content;display:none;font-family:var(--display);font-size:17px;padding:8px 22px;border-radius:22px;border:1px solid #fff3;background:linear-gradient(#ffcf5a,#d98a1c);color:#2a1500;animation:pulse 1.2s infinite}
#quest{position:absolute;top:38px;inset-inline:0;margin:auto;width:max-content;max-width:92%;font-size:12.5px;font-weight:700;color:#fff;background:rgba(10,8,24,.72);padding:4px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18)}
#quest.done{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
#evChip{position:absolute;top:68px;inset-inline:0;margin:auto;width:max-content;max-width:92%;font-size:12px;font-weight:700;color:var(--dim);background:rgba(10,8,24,.72);padding:3px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.14)}
#evChip.live{color:#fff;border-color:var(--ember)}
#evChip.done{color:var(--gold);border-color:var(--gold);animation:pulse 1.2s infinite}
#skills{position:absolute;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,62px);gap:5px;direction:rtl}
#skills button{width:62px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(24,19,49,.82);color:#fff;font-size:11.5px;font-weight:700;line-height:1.1;padding:2px}
#paceTag{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;font-size:10.5px;color:#d9d3f5;background:rgba(10,8,24,.6);padding:2px 8px;border-radius:9px;white-space:nowrap;pointer-events:none;direction:rtl}
@media (min-width:1000px) and (min-height:560px){
  html,body{overflow:hidden}
  #app{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto auto auto minmax(0,1fr)}
  #stage{grid-column:1;grid-row:1/-1;max-height:none;min-height:0;height:100%;flex:none}
  #hud{grid-column:2;grid-row:1}#chatBar{grid-column:2;grid-row:2}#tabs{grid-column:2;grid-row:3}#panel{grid-column:2;grid-row:4;min-height:0}
  #app.wide{grid-template-columns:minmax(0,1fr)}#app.wide #hud,#app.wide #tabs,#app.wide #chatBar{display:none}
  #paceTag{font-size:13px;bottom:8px}
}
#duelBar{position:absolute;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(4,58px);gap:5px;direction:rtl}
#duelBar button{height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);background:rgba(24,19,49,.88);color:#fff;font-size:11px;font-weight:700;line-height:1.1;padding:2px;touch-action:none}
#duelBar button[data-a=atk]{grid-row:span 2;height:auto;font-size:14px;border-color:#ff8a4d;background:rgba(120,40,10,.75)}
#duelBar button small{display:block;font-size:10.5px;font-weight:400;color:#c9c2ea}
#duelBar button:disabled{opacity:.35}
#duelBar button.rdy{border-color:var(--gold);box-shadow:0 0 12px rgba(242,193,78,.55)}
#skills button.cd{opacity:.5;border-color:rgba(255,255,255,.12)}
#skills button.lock{opacity:.3}
#skills button b{display:block;font-size:13px;color:var(--gold)}
#autoBtn{position:absolute;left:8px;bottom:64px;height:36px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:rgba(24,19,49,.82);color:#fff;font-size:12.5px;font-weight:700;padding:0 12px}
#autoBtn.on{border-color:var(--good);color:var(--good)}
#mv{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;direction:ltr}
#mv button{width:56px;height:50px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(24,19,49,.82);color:#fff;font-size:22px;line-height:1;touch-action:none}
#stage.duel #mv button{width:42px}#stage.duel #mv .ud button{width:38px}#stage.duel #duelBar{grid-template-columns:repeat(4,50px)}
@media (min-width:1000px){#stage.duel #duelBar{grid-template-columns:repeat(4,64px)}#stage.duel #mv button{width:56px}}
#mv .ud{display:flex;flex-direction:column;gap:4px}#mv .ud button{width:46px;height:23px;font-size:13px}
#mv button.hold{background:rgba(95,212,255,.35)}
#sndBtn{position:absolute;left:8px;bottom:108px;height:28px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(10,8,24,.6);color:var(--dim);font-size:12px;padding:0 9px}
#sndBtn.on{color:#fff}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 22px #f2c14e}}

#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 1px 7px;font-weight:700;font-size:13px;color:var(--dim);position:relative}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#tabs button .badge{position:absolute;top:5px;inset-inline-end:8%;width:8px;height:8px;border-radius:50%;background:var(--ember)}

#panel{flex:1;overflow-y:auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:17px;margin:4px 0 0;color:var(--gold);text-wrap:balance}
.hint{color:var(--dim);font-size:13px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--dim)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(#ffcf5a,#d98a1c);color:#2a1500;border-color:#fff3}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.pk{border-color:#3a3460;color:#8d87a8;background:rgba(255,255,255,.02);text-decoration:line-through}.btn.pk.on{border-color:#6fe39a;color:#eafff2;background:rgba(111,227,154,.22);text-decoration:none;font-weight:700}
.btn[disabled]{opacity:.4;pointer-events:none}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.tog button{min-width:64px}
.tog button.on{background:#1f5b3c;border-color:var(--good);color:#dfffe9}
.stat{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #2a2350}
.stat:last-child{border-bottom:0}
.stat .n{flex:1}
.stat .n small{display:block;color:var(--dim);font-size:12px}
.stat b{min-width:44px;text-align:center}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.it{background:var(--panel);border:1.5px solid var(--rc,var(--line));border-radius:11px;padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:98px}
.it svg{width:38px;height:38px;flex:none}
.it .nm{font-size:12.5px;font-weight:700;color:var(--rc);line-height:1.15}
.it .sub{font-size:11.5px;color:var(--dim)}
.it.empty{border-style:dashed;color:var(--dim);justify-content:center;font-size:13px}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.g7 svg{filter:drop-shadow(0 0 3px var(--rc))}
.g9 svg{filter:drop-shadow(0 0 6px var(--rc))}
.g11 svg{filter:drop-shadow(0 0 7px var(--rc)) drop-shadow(0 0 3px #fff);animation:glow 1.4s infinite}
.g13 svg{filter:drop-shadow(0 0 9px var(--rc)) drop-shadow(0 0 5px #fff);animation:glow .9s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--rc)) drop-shadow(0 0 6px #fff)}}

.zone{display:flex;gap:10px;align-items:center}
.zone .sw{width:38px;height:38px;border-radius:9px;flex:none;border:1px solid #fff2}
.zone .z{flex:1;min-width:0}
.zone .z b{display:block}
.zone .z small{color:var(--dim);font-size:12.5px;display:block}
.zone.cur{border-color:var(--gold)}
.zone.lock{opacity:.5}

.shop{display:flex;gap:10px;align-items:center}
.shop .z{flex:1;min-width:0}
.shop .z small{display:block;color:var(--dim);font-size:12.5px}
.track{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 10px;scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.tier{flex:none;width:92px;min-height:132px;background:linear-gradient(180deg,#1d1740,#120e2a);border:1.5px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.tier b{font-family:'Suez One',Assistant,sans-serif;font-size:15px;color:var(--dim);line-height:1}
.tier .pic{width:40px;height:40px;display:block;filter:grayscale(.85) brightness(.7)}.tier .pic svg{width:100%;height:100%;display:block}
.tier em{font-style:normal;font-weight:700;color:var(--dim);line-height:1.2;flex:1}
.tier i{font-style:normal;font-size:11px;font-weight:700;color:var(--dim);background:#0a0818;border-radius:8px;padding:2px 8px}
.tier.big{width:112px;background:linear-gradient(180deg,#3a1f66,#1a0f3a);border-color:#7a4fd0}
.tier.got{opacity:.55}.tier.got .pic{filter:none}.tier.got i{color:var(--good)}
.tier.cur{border-color:#8a5cff}.tier.cur .pic{filter:grayscale(.3)}.tier.cur b,.tier.cur em{color:var(--ink)}.tier.cur i{color:#cdb8ff}
.tier.open{border-color:var(--gold);box-shadow:0 0 14px #f2c14e88;animation:tierPulse 1.4s ease-in-out infinite}.tier.open .pic{filter:drop-shadow(0 0 6px #ffd75e)}.tier.open b,.tier.open em{color:var(--gold)}.tier.open i{background:var(--gold);color:#1a1230}
@keyframes tierPulse{50%{box-shadow:0 0 22px #f2c14ecc;transform:translateY(-2px)}}
.passHead{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#2a1a52,#15102e 60%);border:1px solid #5a3fa8;border-radius:14px;padding:12px}
.plv{flex:none;width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe9a6,#c9892a 70%);color:#1a1230;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 16px #f2c14e77,inset 0 -4px 8px rgba(0,0,0,.25)}
.plv b{font-family:'Suez One',Assistant,sans-serif;font-size:30px;line-height:.95}.plv small{font-size:10.5px;font-weight:700;line-height:1.1}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}.pinfo small{color:var(--dim);font-size:12px;line-height:1.35}.pinfo small b{color:var(--gold)}
.bar.big{height:16px;border-radius:9px}.bar.big i{box-shadow:0 0 10px #f2c14e99}
.task .z{flex:1;min-width:0}.task .bar{margin:5px 0 3px}.task.done{opacity:.55}
.btn.glow{box-shadow:0 0 14px #f2c14e88;animation:tierPulse 1.4s ease-in-out infinite}

#panel>*{flex-shrink:0}
#joy{position:absolute;left:14px;bottom:16px;width:116px;height:116px;border-radius:50%;background:radial-gradient(circle,rgba(125,249,255,.10),rgba(20,14,44,.55));border:2px solid rgba(125,249,255,.45);z-index:5;touch-action:none;user-select:none;-webkit-user-select:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff,#3aa8c8);box-shadow:0 0 12px rgba(125,249,255,.7);pointer-events:none}
#useBtn{position:absolute;bottom:150px;inset-inline:0;margin:auto;width:max-content;max-width:92%;font-weight:800;font-size:15px;color:#1a1030;background:linear-gradient(90deg,#ffd75e,#ffb23e);border:2px solid #fff3c4;border-radius:14px;padding:10px 18px;box-shadow:0 0 16px #ffd75eaa;z-index:6}
#brBtn{top:134px!important;background:linear-gradient(90deg,#6a3fd0,#c77dff)!important;border-color:#e6d0ff!important;box-shadow:0 0 14px #c77dff99!important}
#keepBtn,#brBtn{position:absolute;top:98px;inset-inline:0;margin:auto;width:max-content;max-width:92%;font-weight:700;font-size:13.5px;color:#fff;background:linear-gradient(90deg,#b3123a,#e0473a);border:1.5px solid #ffb0b0;border-radius:12px;padding:6px 14px;box-shadow:0 0 14px #ff5c7a99;z-index:4;animation:tierPulse 1.4s ease-in-out infinite}
.resgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}.resgrid div{display:flex;align-items:center;gap:6px;font-size:13.5px}.resgrid span{flex:1;color:var(--dim)}.resgrid b{color:var(--ink)}
#spin{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,5,20,.72);z-index:40;color:#ffe9a6;font-weight:700}#spin.on{display:flex}
#spin i{width:62px;height:62px;border-radius:50%;border:6px solid rgba(255,215,94,.2);border-top-color:#ffd75e;animation:spinR .9s linear infinite;box-shadow:0 0 18px #f2c14e55}@keyframes spinR{to{transform:rotate(360deg)}}
.pack{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin:5px 0;background:#0f0b22}.pack input{width:18px;height:18px;margin:0;flex:none}.pack span{flex:1}.pack small{display:block;color:var(--good);font-size:12px}.pack:has(input:checked){border-color:#7df9ff;box-shadow:0 0 8px #7df9ff55}
.tiers{display:flex;gap:4px;margin:8px 0 4px}.tiers i{flex:1;text-align:center;font-style:normal;font-weight:700;font-size:12px;padding:3px 0;border-radius:7px;background:#0a0818;border:1px solid var(--line);color:var(--dim)}.tiers i.past{color:var(--good);border-color:#2c6b4a}.tiers i.on{background:linear-gradient(#ffe9a6,#c9892a);color:#1a1230;border-color:#ffd75e;box-shadow:0 0 8px #f2c14e88}

.it.ex{border-color:#7dffb0!important;box-shadow:0 0 9px #3dff9a66,inset 0 0 10px #3dff9a22}.it.ex .nm{color:#9dffc4}
.it.ex.full{border-color:#ffd75e!important;animation:exShift 2.4s linear infinite}@keyframes exShift{0%{box-shadow:0 0 10px #ff6b8a99}33%{box-shadow:0 0 10px #ffd75e99}66%{box-shadow:0 0 10px #62f3e299}100%{box-shadow:0 0 10px #ff6b8a99}}

.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.lgrid .tier{width:auto;min-height:112px;padding:6px 3px;font-size:11px}.lgrid .tier.big{grid-column:span 2}.lgrid .tier .pic{width:30px;height:30px}.lgrid .tier b{font-size:13px}
.top{padding:4px 10px}.trow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}.trow:last-child{border-bottom:0}

.trow div{flex:1;min-width:0}.trow b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow small{display:block;color:var(--dim);font-size:11.5px}
.trow span{text-align:center;font-weight:700;font-size:15px;color:var(--ink)}
.trow.m1 i{background:linear-gradient(#ffe9a6,#c9892a);color:#1a1230;border-color:#ffd75e;box-shadow:0 0 10px #f2c14e88}.trow.m2 i{background:linear-gradient(#f1f4f8,#8e99a8);color:#1a1230;border-color:#dfe6ee}.trow.m3 i{background:linear-gradient(#f0b98a,#9a5a2a);color:#1a1230;border-color:#e0a070}
.trow.me{background:rgba(242,193,78,.1);border-radius:10px;padding-inline:8px}
.opp{display:flex;gap:10px;align-items:center}
.opp .z{flex:1;min-width:0}
.opp .z small{display:block;color:var(--dim);font-size:12.5px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:0 6px;color:var(--dim);margin-inline-start:4px}
ol.lb{margin:0;padding-inline-start:22px;font-size:14px}
ol.lb li{padding:2px 0}

#sheet,#modal{position:fixed;inset:0;background:rgba(5,4,14,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal{align-items:center;padding:16px}
#sheet.on,#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:560px;max-height:82%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#modal .box{border-radius:16px;max-width:420px}
.box h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--rc,var(--gold))}
.box .acts{display:flex;gap:8px;flex-wrap:wrap}
.box .acts .btn{flex:1;min-width:92px}
.aff{color:var(--good);font-size:14px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls button{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-weight:700}
.cls button.on{border-color:var(--gold);color:var(--gold)}
.cls small{display:block;color:var(--dim);font-weight:400;font-size:12px}
input[type=text],input[type=password],select{width:100%;background:#0a0818;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px}
#chatBar{display:block;width:100%;text-align:start;background:#0d0a1f;border:0;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatList{flex:0 0 auto;height:300px;max-height:46vh;overflow-y:auto;background:#0a0818;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
#chatList .cl{font-size:14px;line-height:1.35;overflow-wrap:anywhere}#chatList .cl b{color:var(--gold);font-weight:700}#chatList .cl.me b{color:#8fd3ff}
.chatSend{display:flex;gap:6px;margin-bottom:6px}.chatSend input{flex:1}.seg{display:flex;gap:6px;align-items:center}.seg .hint{margin-inline-start:auto}
.box input,.box select{margin:4px 0}a{color:#8fd3ff}
#annc{position:absolute;top:56%;inset-inline:0;margin:auto;width:max-content;max-width:92%;text-align:center;font-family:'Suez One',Assistant,sans-serif;font-size:19px;line-height:1.25;color:#ffe9a6;text-shadow:0 0 10px rgba(255,180,60,.9),0 2px 3px #000,0 0 2px #000;background:linear-gradient(90deg,transparent,rgba(10,6,24,.5) 18%,rgba(10,6,24,.5) 82%,transparent);padding:6px 34px;opacity:0;pointer-events:none;z-index:6}
#annc.on{opacity:1}#annc.live{color:#fff;text-shadow:0 0 12px rgba(255,92,122,.95),0 2px 3px #000,0 0 2px #000;font-size:21px}
#tip{position:absolute;top:134px;inset-inline:0;margin:auto;width:max-content;max-width:88%;background:rgba(255,215,94,.95);color:#1a1230;border:0;border-radius:12px;padding:7px 12px;font-weight:700;font-size:13.5px;line-height:1.3;box-shadow:0 4px 16px rgba(0,0,0,.45);z-index:5}
#tip small{display:block;font-weight:600;font-size:11px;opacity:.7;margin-top:2px}
#net{position:fixed;bottom:6px;inset-inline-start:8px;font-size:11px;color:var(--dim);background:rgba(10,8,24,.7);padding:2px 8px;border-radius:8px;z-index:25;pointer-events:none}
#toasts{position:fixed;top:10px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:rgba(24,19,49,.95);border:1px solid var(--rc,var(--line));color:var(--rc,var(--ink));padding:6px 14px;border-radius:14px;font-size:13.5px;font-weight:700;animation:tin .25s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="row">
      <div><span id="hName">מעגל הנצח</span><span id="hCls"></span></div>
      <div class="lv">רמה <b id="hLv" class="num">1</b> · ריסטים <b id="hRs" class="num">0</b></div>
    </div>
    <div class="bar" aria-label="ניסיון"><i id="hXp"></i></div>
    <div class="cur num">
      <span><i class="dot" style="background:var(--gold)"></i><b id="cGold" title="זהב" aria-label="זהב">0</b></span>
      <span><i class="dot" style="background:var(--arc)"></i><b id="cGem" title="אבני נשמה" aria-label="אבני נשמה">0</b></span>
      <span><i class="dot" style="background:var(--ember)"></i><b id="cCred" title="אותות ריסט" aria-label="אותות ריסט">0</b></span>
      <span><i class="dot" style="background:var(--r2)"></i><b id="cCoin" title="מטבעות עונה" aria-label="מטבעות עונה">0</b></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoneTag"></div><div id="rateTag" class="num"></div><div id="boostTag"></div><div id="paceTag" class="num" style="display:none"></div>
    <button id="quest" data-act="quest"></button>
    <button id="evChip" data-act="evtab"></button>
    <button id="resetNow" data-act="reset">ריסט מוכן</button>
    <button id="keepBtn" data-act="keepGo" style="display:none"></button>
    <button id="brBtn" data-act="brJoin" style="display:none"></button>
    <button id="useBtn" data-act="sgUse" style="display:none"></button>
    <button id="autoBtn" data-act="auto"></button>
    <button id="bigBtn" data-act="big">הגדל</button>
    <button id="fsBtn" data-act="fs" style="display:none">מסך מלא</button>
    <button id="sndBtn" data-act="mute"></button>
    <div id="annc" role="status" aria-live="polite"></div>
    <button id="tip" data-act="tut" style="display:none"><span></span><small></small></button>
    <div id="joy" style="display:none" aria-label="הליכה"><i></i></div>
    <div id="mv"><button id="mvL" aria-label="הליכה שמאלה">&#9664;</button><span class="ud"><button id="mvU" aria-label="פנימה" style="display:none">&#9650;</button><button id="mvD" aria-label="החוצה" style="display:none">&#9660;</button></span><button id="mvR" aria-label="הליכה ימינה">&#9654;</button></div>
    <button id="specBtn" data-act="unwatch" style="display:none;position:absolute;left:50%;transform:translateX(-50%);bottom:10px" class="btn pri">צא מהצפייה</button>
    <div id="duelBar" style="display:none"><button data-act="da" data-a="atk"></button><button data-act="da" data-a="s0"></button><button data-act="da" data-a="s1"></button><button data-act="da" data-a="s3"></button><button data-act="da" data-a="s2"></button><button data-act="da" data-a="dash"></button><button data-act="da" data-a="pot"></button></div>
    <div id="skills"><button data-act="sk" data-i="0"></button><button data-act="sk" data-i="1"></button><button data-act="sk" data-i="2"></button><button data-act="sk" data-i="3"></button><button data-act="sk" data-i="4"></button><button data-act="sk" data-i="5"></button></div>
  </div>
  <button id="chatBar" data-tab="chat" style="display:none"></button>
  <nav id="tabs">
    <button data-tab="char" class="on">דמות</button>
    <button data-tab="gear">ציוד</button>
    <button data-tab="zones">מפה</button>
    <button data-tab="shop">חנות</button>
    <button data-tab="pass">אירועים</button>
    <button data-tab="arena">שחקנים</button>
    <button data-tab="chat">צ'אט</button>
  </nav>
  <main id="panel"></main>
</div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="spin" role="status" aria-live="polite"><i></i><span>בודק את הציוד בתיק...</span></div>
<div id="toasts"></div>
<div id="net"></div>

<script src="config.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
