<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<meta name="referrer" content="same-origin">
<title>מעגל הנצח</title>
<meta name="description" content="משחק תפקידים בדפדפן: מפות, בוסים, סטים עתיקים וריסטים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one-screen app. HUD strip, battle canvas, tab bar, scrolling panel. Single night theme by choice. */
  --night:#0e0b1d; --panel:#181331; --panel2:#231c44; --line:#3a3163;
  --ink:#f1ebff; --dim:#a79fc9; --gold:#f2c14e; --ember:#ff6b3d; --arc:#5fd4ff;
  --good:#6fe39a; --bad:#ff5c7a;
  --r0:#b9b4c7; --r1:#5aa9ff; --r2:#c77dff; --r3:#ffb23e; --r4:#3df5c8;
  --display:'Suez One','Assistant',serif; --body:'Assistant','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.35;overflow:hidden}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#120e26,#0e0b1d)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#hud{padding:8px 14px 6px;display:flex;flex-direction:column;gap:5px;border-bottom:1px solid var(--line)}
#hud .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hName{font-family:var(--display);font-size:19px;color:var(--gold);letter-spacing:.3px}
#hCls{color:var(--dim);font-size:13px;margin-inline-start:6px}
.lv b{color:var(--ink);font-size:17px}
.lv{color:var(--dim);font-size:13px;white-space:nowrap}
.bar{height:9px;background:#0a0818;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5cff,var(--arc));width:0;transition:width .25s}
.bar.gold i{background:linear-gradient(90deg,#c9892a,var(--gold))}
.cur{display:flex;gap:12px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.cur b{color:var(--ink);font-weight:700}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}

#stage{position:relative;flex:0 0 48%;min-height:240px;max-height:430px;background:#000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
#zoneTag{position:absolute;inset-inline-start:8px;top:8px;pointer-events:none;font-size:12px;color:#fff;background:rgba(10,8,24,.6);padding:3px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
#rateTag:empty{display:none}
#rateTag{position:absolute;inset-inline-end:8px;top:8px;pointer-events:none;font-size:12px;color:var(--good);background:rgba(10,8,24,.6);padding:3px 9px;border-radius:10px;border:1px solid rgba(255,255,255,.14)}
#resetNow{position:absolute;top:44px;inset-inline:0;margin:auto;width:max-content;display:none;font-family:var(--display);font-size:17px;padding:8px 22px;border-radius:22px;border:1px solid #fff3;background:linear-gradient(#ffcf5a,#d98a1c);color:#2a1500;animation:pulse 1.2s infinite}
#quest{position:absolute;top:38px;inset-inline:0;margin:auto;width:max-content;max-width:92%;font-size:12.5px;font-weight:700;color:#fff;background:rgba(10,8,24,.72);padding:4px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18)}
#quest.done{border-color:var(--gold);color:var(--gold);animation:pulse 1.2s infinite}
#evChip{position:absolute;top:68px;inset-inline:0;margin:auto;width:max-content;max-width:92%;font-size:12px;font-weight:700;color:var(--dim);background:rgba(10,8,24,.72);padding:3px 11px;border-radius:12px;border:1px solid rgba(255,255,255,.14)}
#evChip.live{color:#fff;border-color:var(--ember)}
#evChip.done{color:var(--gold);border-color:var(--gold);animation:pulse 1.2s infinite}
#skills{position:absolute;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,62px);gap:5px;direction:rtl}
#skills button{width:62px;height:44px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(24,19,49,.82);color:#fff;font-size:11.5px;font-weight:700;line-height:1.1;padding:2px}
#skills button.cd{opacity:.5;border-color:rgba(255,255,255,.12)}
#skills button.lock{opacity:.3}
#skills button b{display:block;font-size:13px;color:var(--gold)}
#autoBtn{position:absolute;left:8px;bottom:64px;height:36px;border-radius:12px;border:1.5px solid rgba(255,255,255,.3);background:rgba(24,19,49,.82);color:#fff;font-size:12.5px;font-weight:700;padding:0 12px}
#autoBtn.on{border-color:var(--good);color:var(--good)}
#mv{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;direction:ltr}
#mv button{width:56px;height:50px;border-radius:12px;border:1.5px solid rgba(255,255,255,.35);background:rgba(24,19,49,.82);color:#fff;font-size:22px;line-height:1;touch-action:none}
#mv button.hold{background:rgba(95,212,255,.35)}
#sndBtn{position:absolute;left:8px;bottom:108px;height:28px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(10,8,24,.6);color:var(--dim);font-size:12px;padding:0 9px}
#sndBtn.on{color:#fff}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 22px #f2c14e}}

#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
#tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 1px 7px;font-weight:700;font-size:13px;color:var(--dim);position:relative}
#tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
#tabs button .badge{position:absolute;top:5px;inset-inline-end:8%;width:8px;height:8px;border-radius:50%;background:var(--ember)}

#panel{flex:1;overflow-y:auto;padding:12px 14px 28px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-weight:400;font-size:17px;margin:4px 0 0;color:var(--gold);text-wrap:balance}
.hint{color:var(--dim);font-size:13px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.kv span:first-child{color:var(--dim)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(#ffcf5a,#d98a1c);color:#2a1500;border-color:#fff3}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.tog button{min-width:64px}
.tog button.on{background:#1f5b3c;border-color:var(--good);color:#dfffe9}
.stat{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #2a2350}
.stat:last-child{border-bottom:0}
.stat .n{flex:1}
.stat .n small{display:block;color:var(--dim);font-size:12px}
.stat b{min-width:44px;text-align:center}

.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.it{background:var(--panel);border:1.5px solid var(--rc,var(--line));border-radius:11px;padding:7px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-height:98px}
.it svg{width:38px;height:38px;flex:none}
.it .nm{font-size:12.5px;font-weight:700;color:var(--rc);line-height:1.15}
.it .sub{font-size:11.5px;color:var(--dim)}
.it.empty{border-style:dashed;color:var(--dim);justify-content:center;font-size:13px}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.g7 svg{filter:drop-shadow(0 0 3px var(--rc))}
.g9 svg{filter:drop-shadow(0 0 6px var(--rc))}
.g11 svg{filter:drop-shadow(0 0 7px var(--rc)) drop-shadow(0 0 3px #fff);animation:glow 1.4s infinite}
.g13 svg{filter:drop-shadow(0 0 9px var(--rc)) drop-shadow(0 0 5px #fff);animation:glow .9s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--rc)) drop-shadow(0 0 6px #fff)}}

.zone{display:flex;gap:10px;align-items:center}
.zone .sw{width:38px;height:38px;border-radius:9px;flex:none;border:1px solid #fff2}
.zone .z{flex:1;min-width:0}
.zone .z b{display:block}
.zone .z small{color:var(--dim);font-size:12.5px;display:block}
.zone.cur{border-color:var(--gold)}
.zone.lock{opacity:.5}

.shop{display:flex;gap:10px;align-items:center}
.shop .z{flex:1;min-width:0}
.shop .z small{display:block;color:var(--dim);font-size:12.5px}
.track{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tier{flex:none;width:74px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}
.tier b{display:block;font-size:13px;color:var(--gold)}
.tier.got{opacity:.45}
.tier.open{border-color:var(--gold);box-shadow:0 0 10px #f2c14e55}
.opp{display:flex;gap:10px;align-items:center}
.opp .z{flex:1;min-width:0}
.opp .z small{display:block;color:var(--dim);font-size:12.5px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:8px;padding:0 6px;color:var(--dim);margin-inline-start:4px}
ol.lb{margin:0;padding-inline-start:22px;font-size:14px}
ol.lb li{padding:2px 0}

#sheet,#modal{position:fixed;inset:0;background:rgba(5,4,14,.72);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal{align-items:center;padding:16px}
#sheet.on,#modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:560px;max-height:82%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#modal .box{border-radius:16px;max-width:420px}
.box h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0;color:var(--rc,var(--gold))}
.box .acts{display:flex;gap:8px;flex-wrap:wrap}
.box .acts .btn{flex:1;min-width:92px}
.aff{color:var(--good);font-size:14px}
.cls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cls button{background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;font-weight:700}
.cls button.on{border-color:var(--gold);color:var(--gold)}
.cls small{display:block;color:var(--dim);font-weight:400;font-size:12px}
input[type=text],input[type=password],select{width:100%;background:#0a0818;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;font-size:16px}
#chatBar{display:block;width:100%;text-align:start;background:#0d0a1f;border:0;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;padding:5px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatList{flex:0 0 auto;height:300px;max-height:46vh;overflow-y:auto;background:#0a0818;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
#chatList .cl{font-size:14px;line-height:1.35;overflow-wrap:anywhere}#chatList .cl b{color:var(--gold);font-weight:700}#chatList .cl.me b{color:#8fd3ff}
.chatSend{display:flex;gap:6px;margin-bottom:6px}.chatSend input{flex:1}.seg{display:flex;gap:6px;align-items:center}.seg .hint{margin-inline-start:auto}
.box input,.box select{margin:4px 0}a{color:#8fd3ff}
#annc{position:absolute;top:38%;inset-inline:0;margin:auto;width:max-content;max-width:92%;text-align:center;font-family:'Suez One',Assistant,sans-serif;font-size:19px;line-height:1.25;color:#ffe9a6;text-shadow:0 0 10px rgba(255,180,60,.9),0 2px 3px #000,0 0 2px #000;background:linear-gradient(90deg,transparent,rgba(10,6,24,.78) 18%,rgba(10,6,24,.78) 82%,transparent);padding:8px 34px;opacity:0;transform:scale(.92);transition:opacity .35s,transform .35s;pointer-events:none;z-index:6}
#annc.on{opacity:1;transform:scale(1)}#annc.live{color:#fff;text-shadow:0 0 12px rgba(255,92,122,.95),0 2px 3px #000,0 0 2px #000;font-size:21px}
#tip{position:absolute;top:98px;inset-inline:0;margin:auto;width:max-content;max-width:88%;background:rgba(255,215,94,.95);color:#1a1230;border:0;border-radius:12px;padding:7px 12px;font-weight:700;font-size:13.5px;line-height:1.3;box-shadow:0 4px 16px rgba(0,0,0,.45);z-index:5}
#tip small{display:block;font-weight:600;font-size:11px;opacity:.7;margin-top:2px}
#net{position:fixed;bottom:6px;inset-inline-start:8px;font-size:11px;color:var(--dim);background:rgba(10,8,24,.7);padding:2px 8px;border-radius:8px;z-index:25;pointer-events:none}
#toasts{position:fixed;top:10px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:30}
.toast{background:rgba(24,19,49,.95);border:1px solid var(--rc,var(--line));color:var(--rc,var(--ink));padding:6px 14px;border-radius:14px;font-size:13.5px;font-weight:700;animation:tin .25s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="row">
      <div><span id="hName">מעגל הנצח</span><span id="hCls"></span></div>
      <div class="lv">רמה <b id="hLv" class="num">1</b> · ריסטים <b id="hRs" class="num">0</b></div>
    </div>
    <div class="bar" aria-label="ניסיון"><i id="hXp"></i></div>
    <div class="cur num">
      <span><i class="dot" style="background:var(--gold)"></i>זהב <b id="cGold">0</b></span>
      <span><i class="dot" style="background:var(--arc)"></i>אבני נשמה <b id="cGem">0</b></span>
      <span><i class="dot" style="background:var(--ember)"></i>אותות ריסט <b id="cCred">0</b></span>
      <span><i class="dot" style="background:var(--r2)"></i>מטבעות עונה <b id="cCoin">0</b></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="zoneTag"></div><div id="rateTag" class="num"></div>
    <button id="quest" data-act="quest"></button>
    <button id="evChip" data-act="evtab"></button>
    <button id="resetNow" data-act="reset">ריסט מוכן</button>
    <button id="autoBtn" data-act="auto"></button>
    <button id="sndBtn" data-act="mute"></button>
    <div id="annc" role="status" aria-live="polite"></div>
    <button id="tip" data-act="tut" style="display:none"><span></span><small></small></button>
    <div id="mv"><button id="mvL" aria-label="הליכה שמאלה">&#9664;</button><button id="mvR" aria-label="הליכה ימינה">&#9654;</button></div>
    <div id="skills"><button data-act="sk" data-i="0"></button><button data-act="sk" data-i="1"></button><button data-act="sk" data-i="2"></button><button data-act="sk" data-i="3"></button><button data-act="sk" data-i="4"></button><button data-act="sk" data-i="5"></button></div>
  </div>
  <button id="chatBar" data-tab="chat" style="display:none"></button>
  <nav id="tabs">
    <button data-tab="char" class="on">דמות</button>
    <button data-tab="gear">ציוד</button>
    <button data-tab="zones">מפה</button>
    <button data-tab="shop">חנות</button>
    <button data-tab="pass">אירועים</button>
    <button data-tab="arena">שחקנים</button>
    <button data-tab="chat">צ'אט</button>
  </nav>
  <main id="panel"></main>
</div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toasts"></div>
<div id="net"></div>

<script src="config.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
